<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="color-scheme" content="dark" />
    <title>远程控制 · ZCode + Codex</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot" id="conn-dot"></span>
        <strong>远程控制</strong>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab is-active" data-tab="codex" role="tab">Codex</button>
        <button class="tab" data-tab="zcode" role="tab">ZCode</button>
      </nav>
      <div class="topbar-right">
        <span class="pill" id="driver-pill">未连接会话</span>
      </div>
    </header>

    <!-- ============================ Codex ============================ -->
    <main class="pane is-active" id="pane-codex">
      <aside class="sidebar" id="thread-list-wrap">
        <div class="sidebar-head">
          <input id="thread-search" type="search" placeholder="过滤会话…" autocomplete="off" />
          <button id="btn-new-thread" class="mini" title="新建会话">＋</button>
        </div>
        <div class="viewtabs" role="tablist">
          <button class="viewtab is-active" data-view="active" role="tab">活动</button>
          <button class="viewtab" data-view="archived" role="tab">已归档</button>
        </div>
        <div class="newthread" id="newthread" hidden>
          <label for="newthread-dir">工作目录</label>
          <select id="newthread-dir"></select>
          <input id="newthread-cwd" type="text" placeholder="/path/to/project" autocomplete="off" hidden />
          <div class="newthread-actions">
            <button id="btn-newthread-create" class="mini">创建</button>
            <button id="btn-newthread-cancel" class="mini">取消</button>
          </div>
        </div>
        <div class="sidebar-list" id="thread-list"></div>
        <div class="sidebar-foot">
          <button id="btn-more" class="mini wide">加载更多</button>
        </div>
      </aside>

      <section class="chat">
        <div class="chat-head" id="chat-head">
          <div class="chat-title">
            <div class="t1" id="thread-title">选择左侧会话</div>
            <div class="t2" id="thread-meta">或新建一个会话开始</div>
          </div>
          <div class="chat-actions">
            <span class="badge" id="lock-badge" hidden></span>
            <button id="btn-release" class="mini" hidden>释放</button>
            <button id="btn-interrupt" class="mini danger" hidden>中断</button>
          </div>
        </div>

        <div class="stream" id="stream">
          <div class="empty" id="stream-empty">
            <p>从左侧选择一个会话查看历史。</p>
            <p class="dim">浏览任意会话是只读的；发送消息时会尝试接管该会话（独占写入）。</p>
          </div>
        </div>

        <div class="composer" id="composer">
          <div class="pending" id="pending" hidden></div>
          <div class="composer-row">
            <textarea id="input" rows="3" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
            <button id="btn-send" class="send">发送</button>
          </div>
          <div class="composer-foot">
            <select id="model-select" title="模型"></select>
            <span class="dim" id="send-hint"></span>
          </div>
        </div>
      </section>
    </main>

    <!-- ============================ ZCode ============================ -->
    <main class="pane" id="pane-zcode">
      <div class="zcode-wrap">
        <div class="zcode-bar">
          <div class="zcode-info">
            <span class="badge" id="zcode-badge">检查中…</span>
            <span class="dim" id="zcode-hint"></span>
          </div>
          <div class="zcode-actions">
            <button id="btn-zcode-open" class="mini">打开官方远控页</button>
            <button id="btn-zcode-embed" class="mini">内嵌</button>
            <button id="btn-zcode-launch" class="mini">唤起桌面端</button>
            <button id="btn-zcode-wait" class="mini">等待配对</button>
            <button id="btn-zcode-reload" class="mini">刷新</button>
          </div>
        </div>
        <div class="zcode-body">
          <iframe
            id="zcode-frame"
            title="ZCode 官方 Web 远控"
            referrerpolicy="no-referrer"
            allow="clipboard-read; clipboard-write"
          ></iframe>
          <div class="zcode-placeholder" id="zcode-placeholder">
            <h3>ZCode 远控</h3>
            <p>凭据就绪后点「内嵌」把官方远控页面载入此处，或点「打开官方远控页」在新标签页打开。</p>
            <p class="dim">
              说明：ZCode 的手机页面需要 relay 配对（sid + passHash），本页直接复用桌面端已经生成的配对的凭据，
              因此不需要重新扫码。
            </p>
          </div>
        </div>
      </div>
    </main>

    <div class="toast-wrap" id="toasts"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
